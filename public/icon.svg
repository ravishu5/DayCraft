<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"/>

  <!-- Morning Sunrise Arc -->
  <circle cx="256" cy="270" r="105" fill="url(#sunGrad)" opacity="0.95"/>
  <ellipse cx="256" cy="290" rx="160" ry="60" fill="#141722"/>

  <!-- Sun Rays -->
  <line x1="256" y1="110" x2="256" y2="140" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="160" x2="162" y2="182" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="372" y1="160" x2="350" y2="182" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="270" x2="120" y2="270" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="422" y1="270" x2="392" y2="270" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

  <!-- Modern Checklist Card Overlay -->
  <rect x="130" y="270" width="252" height="150" rx="20" fill="rgba(26, 30, 44, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3"/>

  <!-- Checklist Rows -->
  <rect x="156" y="300" width="24" height="24" rx="6" fill="#0284c7"/>
  <path d="M162 312 L166 317 L175 307" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="194" y="306" width="150" height="12" rx="6" fill="rgba(255, 255, 255, 0.7)"/>

  <rect x="156" y="342" width="24" height="24" rx="6" fill="#f59e0b"/>
  <path d="M162 354 L166 359 L175 349" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="194" y="348" width="120" height="12" rx="6" fill="rgba(255, 255, 255, 0.5)"/>

  <rect x="156" y="384" width="24" height="24" rx="6" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <rect x="194" y="390" width="80" height="12" rx="6" fill="rgba(255, 255, 255, 0.3)"/>
</svg>
